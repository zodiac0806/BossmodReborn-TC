# 2026-09-05 repo 重建(切斷 fork 網路)後,這個 workflow 需要一次 push 才會重新註冊。
name: Release
on:
  workflow_dispatch:
jobs:
  Build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get Environment Variables
        run: |
          $tag = "${{ github.ref }}" -replace 'refs/tags/', '' -replace '^v', ''

          "tag=$tag" | Out-File -Append -FilePath $Env:GITHUB_ENV
          
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Download Dalamud (pinned TC-compatible build)
        run: |
          Invoke-WebRequest -Uri https://github.com/zodiac0806/BossmodReborn-TC/releases/download/dalamud-pin-v13.0.0.16/dalamud-api13-net9.zip -OutFile dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\"

      - name: Restore Nuget Packages
        run: dotnet restore BossMod\BossModReborn.csproj

      - name: Build Plugin
        run: dotnet build --no-restore -c Release BossMod\BossModReborn.csproj -p:Version=${{ env.tag }} -p:AssemblyVersion=${{ env.tag }} -p:FileVersion=${{ env.tag }} -p:InformationalVersion=${{ env.tag }} --output .\build

      - name: Zip Plugin
        run: Compress-Archive -Path .\build\* -DestinationPath .\build\BossModReborn.zip

      - name: Publish Plugin
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./build/BossModReborn.zip
            ./build/BossModReborn.json
          token: ${{ secrets.GITHUB_TOKEN }}

